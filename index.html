<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Library Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sidebar">
  <h2>📚 LibManage</h2>
  <a class="active" href="index.html">🏠 Dashboard</a>
  <a href="books.html">📖 Books</a>
  <a href="members.html">👨‍🎓 Members</a>
  <a href="issue-return.html">🔄 Issue / Return</a>
</div>
<main>
  <header><div><h1>Library Dashboard</h1><p>Manage your library easily.</p></div><span id="date"></span></header>
  <section class="cards">
    <div class="card"><span>📚</span><h3>Total Books</h3><strong id="totalBooks">0</strong></div>
    <div class="card"><span>👨‍🎓</span><h3>Members</h3><strong id="totalMembers">0</strong></div>
    <div class="card"><span>📤</span><h3>Issued Books</h3><strong id="issuedBooks">0</strong></div>
    <div class="card"><span>💰</span><h3>Total Fine</h3><strong id="totalFine">₹0</strong></div>
  </section>
  <section class="panel">
    <div class="panel-title"><h2>Recent Issued Books</h2><a class="btn" href="issue-return.html">Manage</a></div>
    <div class="table-wrap"><table><thead><tr><th>Book</th><th>Member</th><th>Issue Date</th><th>Due Date</th><th>Status</th></tr></thead><tbody id="recent"></tbody></table></div>
  </section>
</main>
<script src="js/app.js"></script>
</body></html>
